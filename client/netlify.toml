[build]
  command = "npm run build"
  publish = "dist"

# Proxy the API through the site so the login cookie is first-party (works in Safari).
# Replace YOUR-API-NAME with your backend host name.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-API-NAME.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://YOUR-API-NAME.onrender.com/api/sitemap.xml"
  status = 200
  force = true

# Single-page app fallback (must stay last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
